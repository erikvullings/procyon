[workspace]
resolver = "3"
members = ["crates/emfsdk", "crates/emfsdk-derive"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
authors = ["KaiserY"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/KaiserY/emfsdk"
documentation = "https://docs.rs/emfsdk"
description = "EMF, EMF+, and WMF SDK for Rust"
keywords = ["emf", "emfplus", "wmf", "metafile"]
categories = ["parser-implementations"]
readme = "README.md"

[workspace.dependencies]
emfsdk = { version = "0.2.0", path = "crates/emfsdk" }
emfsdk-derive = { version = "0.2.0", path = "crates/emfsdk-derive" }
bitflags = "2.9.1"
encoding_rs = "0.8.35"
fontique = { version = "0.11.0", features = ["fontconfig-dlopen", "system"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
skrifa = "0.43.2"
tiny-skia = { version = "0.12.0", default-features = false, features = ["std"] }
proc-macro2 = "1.0.95"
quote = "1.0.40"
syn = { version = "2.0.104", features = ["full"] }
thiserror = "2.0.12"
