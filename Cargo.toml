]}
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = {version = "0.3.23", features = ["env-filter"]}
url = "2.5.8"
utoipa = {version = "5.5.0", features = ["chrono", "uuid"]}
utoipa-axum = "0.2.0"
utoipa-swagger-ui = {version = "9.0.2", features = ["axum", "vendored"]}
