# `anyhow` is reserved for executables in `apps/`; libraries use `thiserror`.
# This is enforced by the architecture fitness test in `fm-test-support`.
anyhow = "1.0.104"

[workspace.lints.rust]
missing_docs = "warn"
unreachable_pub = "warn"
unsafe_code = "deny"

[workspace.lints.clippy]
all = {level = "warn", priority = -1}
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
