chrono = {version = "0.4.45", features = ["serde"]}
clap = {version = "4.6.4", features = ["derive", "env"]}
crc32fast = "1.5.0"
criterion = {version = "0.5.1", features = ["html_reports"]}
dirs = "6.0.0"
drag = "2.1.1"
dunce = "1.0.5"
flate2 = "1"
