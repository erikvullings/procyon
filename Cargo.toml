  "lua54",
  "vendored",
  "send",
  "serialize",
]}
mp4 = "0.14.0"
notify = "8.2.0"
objc2 = "0.6.4"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"
quicklook = "0.2.2"
openh264 = "0.9.8"
percent-encoding = "2.3.2"
parallel-disk-usage = { version = "0.24.0", default-features = false }
plist = "1.10.0"
quick-xml = "0.41.0"
rand = "0.10"
