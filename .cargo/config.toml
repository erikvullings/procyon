# Homebrew LLD used to speed up large debug links, but LLD 23.1 cannot parse
# the arm64e.x1 target in the macOS 26 SDK's TAPI files. Keep the override
# nearby for when a compatible LLD release is available; Apple ld is used now.
# [target.aarch64-apple-darwin]
# rustflags = ["-C", "link-arg=-fuse-ld=/opt/homebrew/opt/lld/bin/ld64.lld"]
#
# [target.x86_64-apple-darwin]
# rustflags = ["-C", "link-arg=-fuse-ld=/opt/homebrew/opt/lld/bin/ld64.lld"]

[env]
MACOSX_DEPLOYMENT_TARGET = "26.0"
