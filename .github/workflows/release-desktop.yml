name: Release desktop

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub prerelease
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  qualification-safety:
    name: Prove private qualification safety
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prove dispatch has no publication path
        run: node scripts/check-semantic-qualification-workflow.mjs
      - name: Prove both release gates are disabled
        env:
          SEMANTIC_RELEASE_QUALIFIED_VALUE: ${{ vars.SEMANTIC_RELEASE_QUALIFIED }}
          KNOWLEDGE_SEARCH_RELEASE_QUALIFIED_VALUE: ${{ vars.KNOWLEDGE_SEARCH_RELEASE_QUALIFIED }}
        run: node scripts/check-semantic-qualification-workflow.mjs --dispatch-environment

  macos:
    name: Signed and notarized macOS bundles
    needs: [release, semantic-catalogs]
    if: ${{ always() && github.event_name == 'push' && (needs.semantic-catalogs.result == 'success' || needs.semantic-catalogs.result == 'skipped') && needs.release.result == 'success' }}
    runs-on: macos-latest
    timeout-minutes: 120
    environment: desktop-release
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify exact-production semantic evaluation evidence
        if: github.event_name == 'push' && vars.SEMANTIC_RELEASE_QUALIFIED == 'true'
        run: node scripts/check-semantic-release-preconditions.mjs
      - name: Embed the signed macOS arm64 semantic catalog
        if: github.event_name == 'push' && vars.SEMANTIC_RELEASE_QUALIFIED == 'true'
        uses: actions/download-artifact@v5
        with:
          name: semantic-catalog-macos-aarch64
          path: apps/fm-desktop/src-tauri/resources/semantic
      - name: Compile the production semantic catalog trust key
        if: github.event_name == 'push' && vars.SEMANTIC_RELEASE_QUALIFIED == 'true'
        env:
          VERIFYING_KEY_BASE64: ${{ vars.SEMANTIC_CATALOG_VERIFYING_KEY_BASE64 }}
        run: >
          node scripts/export-semantic-verifying-key.mjs
          "$GITHUB_ENV"
      - name: Install universal macOS Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Install lld
        run: brew install lld
      - name: Require tag to match the Cargo-owned desktop version
        if: github.event_name == 'push'
        run: node scripts/check-desktop-release.mjs "${{ github.ref_name }}"
      - name: Record the measured Structured Knowledge Search decision
        env:
          KNOWLEDGE_SEARCH_RELEASE_QUALIFIED: ${{ vars.KNOWLEDGE_SEARCH_RELEASE_QUALIFIED }}
        run: >
          node scripts/export-knowledge-release-qualification.mjs
          "$GITHUB_ENV"
      - name: Verify supported-platform full-text migration and lifecycle
        if: vars.KNOWLEDGE_SEARCH_RELEASE_QUALIFIED == 'true'
        run: node scripts/check-knowledge-search-preconditions.mjs
      - name: Configure temporary signing paths
        run: |
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/apple-api-key.p8" >> "$GITHUB_ENV"
      - name: Import Developer ID Application certificate
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      - name: Install Developer ID G2 intermediate certificate
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/DeveloperIDG2CA.cer"
          curl --fail --silent --show-error --location \
            https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer \
            --output "$CERTIFICATE_PATH"
          echo "f16cd3c54c7f83cea4bf1a3e6a0819c8aaa8e4a1528fd144715f350643d2df3a  $CERTIFICATE_PATH" |
            shasum -a 256 -c -
          if ! IMPORT_OUTPUT="$(
            security import "$CERTIFICATE_PATH" -k signing_temp.keychain -f x509 2>&1
          )"; then
            if [[ "$IMPORT_OUTPUT" != *"specified item already exists"* ]]; then
              echo "$IMPORT_OUTPUT" >&2
              exit 1
            fi
          fi
          rm "$CERTIFICATE_PATH"
      - name: Select Developer ID Application identity
        run: |
          IDENTITY="$(
            security find-identity -v -p codesigning |
              awk -F'"' '/Developer ID Application/ { print $2; exit }'
          )"
          test -n "$IDENTITY"
          echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
      - name: Prepare App Store Connect API key
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          test -n "$APPLE_API_KEY"
          test -n "$APPLE_API_KEY_P8"
          test -n "$APPLE_API_ISSUER"
          printf '%s' "$APPLE_API_KEY_P8" > "$APPLE_API_KEY_PATH"
          chmod 600 "$APPLE_API_KEY_PATH"
      - name: Build signed macOS bundles
        run: pnpm run build:tauri --target universal-apple-darwin
      - name: Notarize and staple the DMG
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          DMG_PATH="$(
            find target/universal-apple-darwin/release/bundle/dmg \
              -maxdepth 1 -type f -name '*.dmg' -print -quit
          )"
          test -n "$DMG_PATH"
          xcrun notarytool submit "$DMG_PATH" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --wait \
            --timeout 45m \
            --no-s3-acceleration
          xcrun stapler staple "$DMG_PATH"
      - name: Verify signature, notarization, stapling, and universal binary
        run: |
          APP_PATH="$(
            find target/universal-apple-darwin/release/bundle/macos \
              -maxdepth 1 -type d -name '*.app' -print -quit
          )"
          DMG_PATH="$(
            find target/universal-apple-darwin/release/bundle/dmg \
              -maxdepth 1 -type f -name '*.dmg' -print -quit
          )"
          test -n "$APP_PATH"
          test -n "$DMG_PATH"
          while IFS= read -r -d '' CANDIDATE; do
            if ! file "$CANDIDATE" | grep -q 'Mach-O'; then
              continue
            fi
            LINKED_LIBRARIES="$(otool -L "$CANDIDATE")"
            printf '%s\n' "$LINKED_LIBRARIES"
            EXTERNAL_DEPENDENCIES="$(
              sed -n 's/^[[:space:]]*\(.*\) (compatibility version .*/\1/p' <<< "$LINKED_LIBRARIES" |
                grep -Ev '^(/System/Library/|/usr/lib/|@)' || true
            )"
            if [[ -n "$EXTERNAL_DEPENDENCIES" ]]; then
              echo "::error::$CANDIDATE has external build-machine dependencies"
              printf '%s\n' "$EXTERNAL_DEPENDENCIES"
              exit 1
            fi
          done < <(find "$APP_PATH" -type f -print0)
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign -dv --verbose=4 "$APP_PATH" 2>&1 |
            grep -F "Authority=Developer ID Application"
          spctl --assess --type execute --verbose=4 "$APP_PATH"
          codesign --verify --strict --verbose=2 "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$DMG_PATH"
          hdiutil verify "$DMG_PATH"
          ARCHITECTURES="$(lipo -archs "$APP_PATH/Contents/MacOS/Procyon")"
          grep -qw arm64 <<< "$ARCHITECTURES"
          grep -qw x86_64 <<< "$ARCHITECTURES"
      - uses: softprops/action-gh-release@v2
        if: github.event_name == 'push'
        with:
          files: |
            target/universal-apple-darwin/release/bundle/dmg/*.dmg
      - name: Remove temporary signing credentials
        if: always()
        run: rm -f "$APPLE_API_KEY_PATH"

  linux:
    name: Linux packages
    needs: [release, semantic-catalogs]
    if: ${{ always() && github.event_name == 'push' && (needs.semantic-catalogs.result == 'success' || needs.semantic-catalogs.result == 'skipped') && needs.release.result == 'success' }}
    runs-on: ubuntu-22.04
    environment: desktop-release
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify exact-production semantic evaluation evidence
        if: github.event_name == 'push' && vars.SEMANTIC_RELEASE_QUALIFIED == 'true'
        run: node scripts/check-semantic-release-preconditions.mjs
      - name: Embed the signed Linux x86-64 semantic catalog
        if: github.event_name == 'push' && vars.SEMANTIC_RELEASE_QUALIFIED == 'true'
        uses: actions/download-artifact@v5
        with:
          name: semantic-catalog-linux-x86_64
          path: apps/fm-desktop/src-tauri/resources/semantic
      - name: Compile the production semantic catalog trust key
        if: github.event_name == 'push' && vars.SEMANTIC_RELEASE_QUALIFIED == 'true'
        env:
          VERIFYING_KEY_BASE64: ${{ vars.SEMANTIC_CATALOG_VERIFYING_KEY_BASE64 }}
        run: >
          node scripts/export-semantic-verifying-key.mjs
          "$GITHUB_ENV"
      - name: Require tag to match the Cargo-owned desktop version
        if: github.event_name == 'push'
        run: node scripts/check-desktop-release.mjs "$GITHUB_REF_NAME"
      - name: Record the measured Structured Knowledge Search decision
        env:
          KNOWLEDGE_SEARCH_RELEASE_QUALIFIED: ${{ vars.KNOWLEDGE_SEARCH_RELEASE_QUALIFIED }}
        run: >
          node scripts/export-knowledge-release-qualification.mjs
          "$GITHUB_ENV"
      - name: Verify supported-platform full-text migration and lifecycle
        if: vars.KNOWLEDGE_SEARCH_RELEASE_QUALIFIED == 'true'
        run: node scripts/check-knowledge-search-preconditions.mjs
      - name: Build Linux packages
        run: pnpm run build:tauri
      - uses: softprops/action-gh-release@v2
        if: github.event_name == 'push'
        with:
          files: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage

  windows:
    name: Unsigned Windows installers
    needs: [release, semantic-catalogs]
    if: ${{ always() && github.event_name == 'push' && (needs.semantic-catalogs.result == 'success' || needs.semantic-catalogs.result == 'skipped') && needs.release.result == 'success' }}
    runs-on: windows-latest
    environment: desktop-release
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify exact-production semantic evaluation evidence
        if: github.event_name == 'push' && vars.SEMANTIC_RELEASE_QUALIFIED == 'true'
        run: node scripts/check-semantic-release-preconditions.mjs
      - name: Embed the signed Windows x86-64 semantic catalog
        if: github.event_name == 'push' && vars.SEMANTIC_RELEASE_QUALIFIED == 'true'
        uses: actions/download-artifact@v5
        with:
          name: semantic-catalog-windows-x86_64
          path: apps/fm-desktop/src-tauri/resources/semantic
      - name: Compile the production semantic catalog trust key
        if: github.event_name == 'push' && vars.SEMANTIC_RELEASE_QUALIFIED == 'true'
        env:
          VERIFYING_KEY_BASE64: ${{ vars.SEMANTIC_CATALOG_VERIFYING_KEY_BASE64 }}
        run: >
          node scripts/export-semantic-verifying-key.mjs
          "$env:GITHUB_ENV"
      - name: Require tag to match the Cargo-owned desktop version
        if: github.event_name == 'push'
        run: node scripts/check-desktop-release.mjs "$env:GITHUB_REF_NAME"
      - name: Record the measured Structured Knowledge Search decision
        env:
          KNOWLEDGE_SEARCH_RELEASE_QUALIFIED: ${{ vars.KNOWLEDGE_SEARCH_RELEASE_QUALIFIED }}
        run: >
          node scripts/export-knowledge-release-qualification.mjs
          "$env:GITHUB_ENV"
      - name: Verify supported-platform full-text migration and lifecycle
        if: vars.KNOWLEDGE_SEARCH_RELEASE_QUALIFIED == 'true'
        run: node scripts/check-knowledge-search-preconditions.mjs
      - name: Build unsigned Windows installers
        run: pnpm run build:tauri
      - uses: softprops/action-gh-release@v2
        if: github.event_name == 'push'
        with:
          files: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*-setup.exe

  semantic-payloads:
    name: Semantic payloads (${{ matrix.target }})
    needs: [release, qualification-safety]
    if: ${{ always() && ((github.event_name == 'workflow_dispatch' && needs.qualification-safety.result == 'success') || (github.event_name == 'push' && vars.SEMANTIC_RELEASE_QUALIFIED == 'true' && needs.release.result == 'success')) }}
    runs-on: ${{ matrix.runner }}
    environment: desktop-release
    permissions:
      contents: read
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-aarch64
            runner: macos-15
          - target: windows-x86_64
            runner: windows-latest
          - target: linux-x86_64
            runner: ubuntu-22.04
          - target: linux-aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install Linux desktop qualification dependencies
        if: github.event_name == 'workflow_dispatch' && startsWith(matrix.target, 'linux-')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xvfb
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prove qualification dispatch cannot publish
        run: node scripts/check-semantic-qualification-workflow.mjs
      - name: Verify exact-production semantic evaluation evidence
        if: github.event_name == 'push' && vars.SEMANTIC_RELEASE_QUALIFIED == 'true'
        run: node scripts/check-semantic-release-preconditions.mjs
      - name: Configure the MSVC tool environment
        if: matrix.target == 'windows-x86_64'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Install the configured macOS linker
        if: matrix.target == 'macos-aarch64'
        run: brew install lld
      - name: Require tag to match the Cargo-owned desktop version
        if: github.event_name == 'push'
        run: node scripts/check-desktop-release.mjs "${{ github.ref_name }}"
      - name: Configure temporary macOS notarization path
        if: matrix.target == 'macos-aarch64'
        shell: bash
        run: echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/apple-api-key.p8" >> "$GITHUB_ENV"
      - name: Import Developer ID Application certificate
        if: matrix.target == 'macos-aarch64'
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      - name: Install Developer ID G2 intermediate certificate
        if: matrix.target == 'macos-aarch64'
        shell: bash
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/DeveloperIDG2CA.cer"
          curl --fail --silent --show-error --location \
            https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer \
            --output "$CERTIFICATE_PATH"
          echo "f16cd3c54c7f83cea4bf1a3e6a0819c8aaa8e4a1528fd144715f350643d2df3a  $CERTIFICATE_PATH" |
            shasum -a 256 --check
          sudo security add-trusted-cert \
            -d -r trustRoot \
            -k /Library/Keychains/System.keychain \
            "$CERTIFICATE_PATH"
      - name: Select Developer ID Application identity
        if: matrix.target == 'macos-aarch64'
        shell: bash
        run: |
          IDENTITY="$(
            security find-identity -v -p codesigning |
              awk -F'"' '/Developer ID Application/ { print $2; exit }'
          )"
          test -n "$IDENTITY"
          echo "PROCYON_APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
      - name: Prepare App Store Connect API key
        if: matrix.target == 'macos-aarch64'
        shell: bash
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          test -n "$APPLE_API_KEY"
          test -n "$APPLE_API_KEY_P8"
          test -n "$APPLE_API_ISSUER"
          printf '%s' "$APPLE_API_KEY_P8" > "$APPLE_API_KEY_PATH"
          chmod 600 "$APPLE_API_KEY_PATH"
      - name: Build verified semantic release payloads
        env:
          PROCYON_REQUIRE_CLEAN_SOURCE: "1"
          PROCYON_REQUIRE_PLATFORM_SIGNING: "1"
        run: >
          pnpm semantic:bundle:production --
          --output "target/semantic-production-release/${{ matrix.target }}"
          --release-base-url
          "${{ github.event_name == 'push' && format('https://github.com/{0}/releases/download/{1}', github.repository, github.ref_name) || format('https://qualification.invalid/{0}', github.sha) }}"
          --source-revision "${{ github.sha }}"
      - name: Notarize and verify macOS semantic executables
        if: matrix.target == 'macos-aarch64'
        shell: bash
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          ARTIFACTS="target/semantic-production-release/${{ matrix.target }}/artifacts"
          WORKER="$(find "$ARTIFACTS" -maxdepth 1 -type f -name 'procyon.semantic.worker.*' -print -quit)"
          RUNTIME="$(find "$ARTIFACTS" -maxdepth 1 -type f -name 'procyon.semantic.zvec-runtime.*' -print -quit)"
          test -n "$WORKER"
          test -n "$RUNTIME"
          codesign --verify --strict --verbose=2 "$WORKER"
          codesign --verify --strict --verbose=2 "$RUNTIME"
          NOTARY_DIRECTORY="$RUNNER_TEMP/semantic-notary"
          mkdir -p "$NOTARY_DIRECTORY"
          cp "$WORKER" "$RUNTIME" "$NOTARY_DIRECTORY/"
          ditto -c -k --keepParent "$NOTARY_DIRECTORY" "$RUNNER_TEMP/semantic-notary.zip"
          xcrun notarytool submit "$RUNNER_TEMP/semantic-notary.zip" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --wait \
            --timeout 45m \
            --no-s3-acceleration \
            --output-format json > "$RUNNER_TEMP/semantic-notary-result.json"
          node scripts/zvec-runtime-qualification.mjs record-notarization \
            "target/semantic-production-release/${{ matrix.target }}" \
            "$RUNNER_TEMP/semantic-notary-result.json" \
            "$RUNNER_TEMP/semantic-notary.zip"
      - name: Smoke-test protocol, model activation, and component lifecycle
        if: github.event_name == 'push'
        env:
          PROCYON_REQUIRE_ZVEC_PRODUCTION_TRUST: "1"
        run: >
          node scripts/smoke-semantic-production-bundle.mjs
          "target/semantic-production-release/${{ matrix.target }}"
          --evaluation-report
          "target/semantic-production-release/${{ matrix.target }}/semantic-production-evaluation.json"
      - name: Qualify packaged worker lifecycle and privacy
        if: github.event_name == 'workflow_dispatch'
        env:
          PROCYON_REQUIRE_ZVEC_PRODUCTION_TRUST: "1"
          SEMANTIC_RELEASE_QUALIFIED_VALUE: ${{ vars.SEMANTIC_RELEASE_QUALIFIED }}
          KNOWLEDGE_SEARCH_RELEASE_QUALIFIED_VALUE: ${{ vars.KNOWLEDGE_SEARCH_RELEASE_QUALIFIED }}
        run: >
          node scripts/qualify-semantic-payload.mjs
          "target/semantic-production-release/${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: semantic-payloads-${{ matrix.target }}
          path: target/semantic-production-release/${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 7
      - name: Upload redacted worker qualification failure reports
        uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && failure()
        with:
          name: semantic-payload-qualification-failure-${{ matrix.target }}
          path: |
            target/semantic-production-release/${{ matrix.target }}/qualification-worker/privacy-report.json
            target/semantic-production-release/${{ matrix.target }}/qualification-worker/qualification-report.json
            target/semantic-production-release/${{ matrix.target }}/qualification-worker/safe-evidence/
          if-no-files-found: warn
          retention-days: 7
      - name: Remove temporary macOS signing credentials
        if: always() && matrix.target == 'macos-aarch64'
        shell: bash
        run: rm -f "$APPLE_API_KEY_PATH"

  semantic-catalogs:
    name: Semantic catalog (${{ matrix.target }})
    needs: [semantic-payloads]
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || vars.SEMANTIC_RELEASE_QUALIFIED == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        target: [macos-aarch64, windows-x86_64, linux-x86_64, linux-aarch64]
    permissions:
      contents: read
    uses: ./.github/workflows/sign-semantic-catalog.yml
    with:
      release-input-artifact: semantic-payloads-${{ matrix.target }}
      signed-catalog-artifact: semantic-catalog-${{ matrix.target }}
    secrets: inherit

  semantic-installed-qualification:
    name: Installed semantic qualification (${{ matrix.target }})
    needs: [qualification-safety, semantic-payloads, semantic-catalogs]
    if: ${{ always() && github.event_name == 'workflow_dispatch' && needs.qualification-safety.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    environment: desktop-release
    permissions:
      contents: read
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-aarch64
            runner: macos-15
          - target: windows-x86_64
            runner: windows-latest
          - target: linux-x86_64
            runner: ubuntu-22.04
          - target: linux-aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install Linux package and launch dependencies
        if: startsWith(matrix.target, 'linux-')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils \
            xvfb
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prove qualification remains private and gated off
        env:
          SEMANTIC_RELEASE_QUALIFIED_VALUE: ${{ vars.SEMANTIC_RELEASE_QUALIFIED }}
          KNOWLEDGE_SEARCH_RELEASE_QUALIFIED_VALUE: ${{ vars.KNOWLEDGE_SEARCH_RELEASE_QUALIFIED }}
        run: |
          node scripts/check-semantic-qualification-workflow.mjs
          node scripts/check-semantic-qualification-workflow.mjs --dispatch-environment
      - uses: actions/download-artifact@v5
        with:
          name: semantic-payloads-${{ matrix.target }}
          path: semantic-release-input
      - uses: actions/download-artifact@v5
        with:
          name: semantic-catalog-${{ matrix.target }}
          path: apps/fm-desktop/src-tauri/resources/semantic
      - name: Compile catalog trust and retain the public verification key
        shell: bash
        env:
          VERIFYING_KEY_BASE64: ${{ vars.SEMANTIC_CATALOG_VERIFYING_KEY_BASE64 }}
        run: >
          node scripts/export-semantic-verifying-key.mjs
          "$GITHUB_ENV"
          "$RUNNER_TEMP/semantic-catalog.pub"
      - name: Record the disabled Structured Knowledge Search decision
        shell: bash
        env:
          KNOWLEDGE_SEARCH_RELEASE_QUALIFIED: "false"
        run: >
          node scripts/export-knowledge-release-qualification.mjs
          "$GITHUB_ENV"
      - name: Configure temporary macOS notarization path
        if: matrix.target == 'macos-aarch64'
        shell: bash
        run: echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/apple-api-key.p8" >> "$GITHUB_ENV"
      - name: Import Developer ID Application certificate
        if: matrix.target == 'macos-aarch64'
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      - name: Install Developer ID G2 intermediate certificate
        if: matrix.target == 'macos-aarch64'
        shell: bash
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/DeveloperIDG2CA.cer"
          curl --fail --silent --show-error --location \
            https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer \
            --output "$CERTIFICATE_PATH"
          echo "f16cd3c54c7f83cea4bf1a3e6a0819c8aaa8e4a1528fd144715f350643d2df3a  $CERTIFICATE_PATH" |
            shasum -a 256 --check
          sudo security add-trusted-cert \
            -d -r trustRoot \
            -k /Library/Keychains/System.keychain \
            "$CERTIFICATE_PATH"
      - name: Select Developer ID Application identity
        if: matrix.target == 'macos-aarch64'
        shell: bash
        run: |
          IDENTITY="$(
            security find-identity -v -p codesigning |
              awk -F'"' '/Developer ID Application/ { print $2; exit }'
          )"
          test -n "$IDENTITY"
          echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
      - name: Prepare App Store Connect API key
        if: matrix.target == 'macos-aarch64'
        shell: bash
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          test -n "$APPLE_API_KEY"
          test -n "$APPLE_API_KEY_P8"
          test -n "$APPLE_API_ISSUER"
          printf '%s' "$APPLE_API_KEY_P8" > "$APPLE_API_KEY_PATH"
          chmod 600 "$APPLE_API_KEY_PATH"
      - name: Build private catalog-enabled desktop package
        run: pnpm run build:tauri
      - name: Notarize and staple the private macOS qualification DMG
        if: matrix.target == 'macos-aarch64'
        shell: bash
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          DMG_PATH="$(
            find target/release/bundle/dmg \
              -maxdepth 1 -type f -name '*.dmg' -print -quit
          )"
          test -n "$DMG_PATH"
          xcrun notarytool submit "$DMG_PATH" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --wait \
            --timeout 45m \
            --no-s3-acceleration
          xcrun stapler staple "$DMG_PATH"
          codesign --verify --strict --verbose=2 "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"
      - name: Run installed lifecycle, failure, and privacy qualification
        env:
          PROCYON_QUALIFICATION_TARGET: ${{ matrix.target }}
          SEMANTIC_RELEASE_QUALIFIED_VALUE: ${{ vars.SEMANTIC_RELEASE_QUALIFIED }}
          KNOWLEDGE_SEARCH_RELEASE_QUALIFIED_VALUE: ${{ vars.KNOWLEDGE_SEARCH_RELEASE_QUALIFIED }}
        run: >
          node scripts/qualify-semantic-installed.mjs
          --bundle semantic-release-input
          --catalog apps/fm-desktop/src-tauri/resources/semantic
          --public-key "${{ runner.temp }}/semantic-catalog.pub"
          --evidence "target/semantic-installed-qualification/${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: semantic-installed-qualification-${{ matrix.target }}
          path: |
            target/semantic-installed-qualification/${{ matrix.target }}/
            target/release/bundle/
          if-no-files-found: error
          retention-days: 7
      - name: Upload redacted qualification failure reports
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: semantic-installed-qualification-failure-${{ matrix.target }}
          path: |
            target/semantic-installed-qualification/${{ matrix.target }}/privacy-report.json
            target/semantic-installed-qualification/${{ matrix.target }}/summary.json
            target/semantic-installed-qualification/${{ matrix.target }}/safe-evidence/
          if-no-files-found: warn
          retention-days: 7
      - name: Remove temporary macOS signing credentials
        if: always() && matrix.target == 'macos-aarch64'
        shell: bash
        run: rm -f "$APPLE_API_KEY_PATH"

  semantic-collect:
    name: Collect semantic release assets
    needs: [semantic-payloads]
    if: ${{ needs.semantic-payloads.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          pattern: semantic-payloads-*
          path: semantic-payloads
      - uses: actions/download-artifact@v5
        with:
          pattern: semantic-catalog-*
          path: semantic-catalogs
      - name: Collect unique payloads and target catalogs
        run: >
          node scripts/collect-semantic-release-assets.mjs
          semantic-payloads semantic-catalogs semantic-release-assets
      - name: Aggregate private supported-target semantic evaluation
        run: >
          node scripts/aggregate-semantic-production-evaluation.mjs
          semantic-payloads
          semantic-release-assets/semantic-production-evaluation.json
          docs/evaluations/semantic-production-v1.json
      - name: Match evaluated payloads to the reviewed release evidence
        if: github.event_name == 'push'
        run: >
          node scripts/check-semantic-release-preconditions.mjs
          --report semantic-release-assets/semantic-production-evaluation.json
          --approved-report docs/evaluations/semantic-production-v1.json
      - uses: actions/upload-artifact@v4
        with:
          name: semantic-release-assets-${{ github.sha }}
          path: semantic-release-assets/
          if-no-files-found: error
          retention-days: 7

  semantic-publish:
    name: Publish semantic release assets
    needs: [release, semantic-collect]
    if: ${{ github.event_name == 'push' && needs.release.result == 'success' && needs.semantic-collect.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: semantic-release-assets-${{ github.sha }}
          path: semantic-release-assets
      - uses: softprops/action-gh-release@v2
        with:
          files: semantic-release-assets/*

  homebrew:
    name: Publish cross-platform Homebrew cask
    needs: [macos, linux]
    if: github.event_name == 'push'
    runs-on: macos-latest
    environment: desktop-release
    steps:
      - uses: actions/checkout@v5
      - name: Download the macOS and Linux release packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" \
            --pattern "*.dmg" \
            --pattern "*.AppImage" \
            --dir package-input
      - name: Generate the cask from the released packages
        run: |
          DMG_PATH="$(find package-input -type f -name '*.dmg' -print -quit)"
          APPIMAGE_PATH="$(find package-input -type f -name '*.AppImage' -print -quit)"
          test -n "$DMG_PATH"
          test -n "$APPIMAGE_PATH"
          VERSION="${GITHUB_REF_NAME#v}"
          DMG_SHA256="$(shasum -a 256 "$DMG_PATH" | cut -d ' ' -f 1)"
          APPIMAGE_SHA256="$(shasum -a 256 "$APPIMAGE_PATH" | cut -d ' ' -f 1)"
          node scripts/generate-package-manager-files.mjs homebrew \
            --version "$VERSION" \
            --sha256 "$DMG_SHA256" \
            --repository "$GITHUB_REPOSITORY" \
            --asset "$(basename "$DMG_PATH")" \
            --linux-sha256 "$APPIMAGE_SHA256" \
            --linux-asset "$(basename "$APPIMAGE_PATH")" \
            --output generated-cask/procyon.rb
      - uses: actions/checkout@v5
        with:
          repository: ${{ vars.HOMEBREW_TAP_REPOSITORY }}
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap
      - name: Commit the cask to the tap
        env:
          HOMEBREW_TAP_REPOSITORY: ${{ vars.HOMEBREW_TAP_REPOSITORY }}
        run: |
          mkdir -p homebrew-tap/Casks
          cp generated-cask/procyon.rb homebrew-tap/Casks/procyon.rb
          git -C homebrew-tap config user.name "github-actions[bot]"
          git -C homebrew-tap config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C homebrew-tap add Casks/procyon.rb
          git -C homebrew-tap diff --cached --quiet && exit 0
          git -C homebrew-tap commit -m "procyon ${GITHUB_REF_NAME#v}"
          git -C homebrew-tap push

  chocolatey:
    needs: windows
    if: github.event_name == 'push'
    uses: ./.github/workflows/publish-chocolatey.yml
    with:
      release_tag: ${{ github.ref_name }}
    secrets: inherit
