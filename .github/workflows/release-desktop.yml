name: Release desktop

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub prerelease
    runs-on: ubuntu-latest
    steps:
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  macos:
    name: Unsigned macOS bundles
    needs: [release]
    runs-on: macos-latest
    environment: desktop-release
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install universal macOS Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Install lld
        run: brew install lld
      - name: Require tag to match the Cargo-owned desktop version
        run: node scripts/check-desktop-release.mjs "$GITHUB_REF_NAME"
      - name: Build unsigned macOS bundles
        run: pnpm run build:tauri --target universal-apple-darwin
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            target/universal-apple-darwin/release/bundle/dmg/*.dmg

  linux:
    name: Linux packages
    needs: [release]
    runs-on: ubuntu-22.04
    environment: desktop-release
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Require tag to match the Cargo-owned desktop version
        run: node scripts/check-desktop-release.mjs "$GITHUB_REF_NAME"
      - name: Build Linux packages
        run: pnpm run build:tauri
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage

  windows:
    name: Unsigned Windows installers
    needs: [release]
    runs-on: windows-latest
    environment: desktop-release
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Require tag to match the Cargo-owned desktop version
        run: node scripts/check-desktop-release.mjs "$env:GITHUB_REF_NAME"
      - name: Build unsigned Windows installers
        run: pnpm run build:tauri
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*-setup.exe

  homebrew:
    name: Publish Homebrew cask
    needs: [macos]
    runs-on: macos-latest
    environment: desktop-release
    steps:
      - uses: actions/checkout@v5
      - name: Download the unsigned DMG
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$GITHUB_REF_NAME" --pattern "*.dmg" --dir package-input
      - name: Generate the cask from the released asset
        run: |
          DMG_PATH="$(find package-input -type f -name '*.dmg' -print -quit)"
          test -n "$DMG_PATH"
          VERSION="${GITHUB_REF_NAME#v}"
          SHA256="$(shasum -a 256 "$DMG_PATH" | cut -d ' ' -f 1)"
          node scripts/generate-package-manager-files.mjs homebrew \
            --version "$VERSION" \
            --sha256 "$SHA256" \
            --repository "$GITHUB_REPOSITORY" \
            --asset "$(basename "$DMG_PATH")" \
            --output generated-cask/procyon.rb
      - uses: actions/checkout@v5
        with:
          repository: ${{ vars.HOMEBREW_TAP_REPOSITORY }}
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap
      - name: Commit the cask to the tap
        env:
          HOMEBREW_TAP_REPOSITORY: ${{ vars.HOMEBREW_TAP_REPOSITORY }}
        run: |
          mkdir -p homebrew-tap/Casks
          cp generated-cask/procyon.rb homebrew-tap/Casks/procyon.rb
          git -C homebrew-tap config user.name "github-actions[bot]"
          git -C homebrew-tap config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C homebrew-tap add Casks/procyon.rb
          git -C homebrew-tap diff --cached --quiet && exit 0
          git -C homebrew-tap commit -m "procyon ${GITHUB_REF_NAME#v}"
          git -C homebrew-tap push

  chocolatey:
    needs: windows
    uses: ./.github/workflows/publish-chocolatey.yml
    with:
      release_tag: ${{ github.ref_name }}
    secrets: inherit
