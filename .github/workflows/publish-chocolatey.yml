name: Publish Chocolatey

on:
  workflow_call:
    inputs:
      release_tag:
        description: Existing GitHub release tag to package
        required: true
        type: string
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub release tag to package
        required: true
        type: string

permissions:
  contents: write

jobs:
  chocolatey:
    name: Publish Chocolatey package
    runs-on: windows-latest
    environment: desktop-release
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@v7
      - name: Download the unsigned NSIS installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$env:RELEASE_TAG" --pattern "*-setup.exe" --dir package-input
      - name: Generate and pack the Chocolatey package
        shell: pwsh
        run: |
          $installer = Get-ChildItem package-input -Filter *-setup.exe | Select-Object -First 1
          if (-not $installer) { throw "The GitHub release has no NSIS setup executable" }
          $version = $env:RELEASE_TAG.Substring(1)
          $checksum = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          node scripts/generate-package-manager-files.mjs chocolatey `
            --version $version `
            --sha256 $checksum `
            --repository $env:GITHUB_REPOSITORY `
            --asset $installer.Name `
            --output chocolatey-package
          choco pack chocolatey-package/procyon.nuspec --output-directory chocolatey-output
      - name: Attach the .nupkg to the GitHub release
        # Upload first so a package remains available for manual publishing after an upstream error.
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $package = Get-ChildItem chocolatey-output -Filter *.nupkg | Select-Object -First 1
          if (-not $package) { throw "Chocolatey package was not created" }
          gh release upload "$env:RELEASE_TAG" $package.FullName --clobber
      - name: Push to the Chocolatey Community Repository
        shell: pwsh
        env:
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
        run: |
          $package = Get-ChildItem chocolatey-output -Filter *.nupkg | Select-Object -First 1
          if (-not $package) { throw "Chocolatey package was not created" }
          $maxAttempts = 4
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            $output = choco push $package.FullName --source https://push.chocolatey.org/ --api-key $env:CHOCOLATEY_API_KEY --execution-timeout=500 2>&1
            $exitCode = $LASTEXITCODE
            $output | ForEach-Object { Write-Host $_ }
            if ($exitCode -eq 0) { exit 0 }
            $details = $output -join [Environment]::NewLine
            if ($details -match '403 \(Forbidden\)') {
              Write-Warning "Chocolatey rejected the configured API key. Verify the desktop-release CHOCOLATEY_API_KEY secret. The .nupkg remains attached to the GitHub release for manual publication."
              "### Chocolatey publication" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
              "Chocolatey returned 403 Forbidden. Verify the desktop-release API key; the package is attached to the GitHub release." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
              exit 0
            }
            Write-Warning "Attempt $attempt of $maxAttempts failed with exit code $exitCode."
            if ($attempt -lt $maxAttempts) { Start-Sleep -Seconds (30 * $attempt) }
          }
          Write-Warning "Chocolatey remained unavailable after $maxAttempts attempts. The .nupkg remains attached to the GitHub release for manual publication."
          "### Chocolatey publication" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "Automatic publication failed after $maxAttempts attempts; the package is attached to the GitHub release." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
