name: Release semantic components

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Immutable semantic component tag, for example semantic-v1
        required: true
        type: string
      qualification_run_id:
        description: Exact successful qualification run to publish; leave empty to qualify
        required: false
        default: ""
        type: string
      qualify_gemma:
        description: Include pinned EmbeddingGemma 2 originals in a private qualification run
        required: false
        default: false
        type: boolean
      qualify_installed_gemma:
        description: Read-only installed lifecycle against a retained signed candidate
        required: false
        default: false
        type: boolean
      installed_candidate_run_id:
        description: Exact retained candidate qualification run for installed Gemma checks
        required: false
        default: ""
        type: string
      installed_candidate_source_revision:
        description: Exact 40-character candidate source revision for installed Gemma checks
        required: false
        default: ""
        type: string
      measure_installed_gemma:
        description: With qualify_installed_gemma, measure the installed candidate at 128/256/512/768d
        required: false
        default: false
        type: boolean
      approve_experimental_gemma:
        description: Explicitly publish only the reviewed signed Gemma candidate as EXPERIMENTAL (never used for qualification)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  semantic-payloads:
    name: Semantic payloads (${{ matrix.target }})
    if: inputs.qualification_run_id == '' && inputs.qualify_installed_gemma != true && inputs.measure_installed_gemma != true
    runs-on: ${{ matrix.runner }}
    environment: desktop-release
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-aarch64
            runner: macos-15
          - target: windows-x86_64
            runner: windows-latest
          - target: linux-x86_64
            runner: ubuntu-22.04
          - target: linux-aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
      - name: Validate immutable component release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^semantic-v[0-9][0-9A-Za-z.-]*$ ]]
          test -z "$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG")"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Fetch verified Gemma originals
        if: inputs.qualify_gemma == true
        shell: bash
        run: |
          printf 'GEMMA_ORIGINAL_FILES=' >> "$GITHUB_ENV"
          node scripts/fetch-embeddinggemma-probe.mjs "$RUNNER_TEMP/embeddinggemma-verified" >> "$GITHUB_ENV"
      - name: Configure the MSVC tool environment
        if: matrix.target == 'windows-x86_64'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Select the MSVC linker
        if: matrix.target == 'windows-x86_64'
        shell: pwsh
        run: |
          $linker = Join-Path $env:VCToolsInstallDir 'bin\Hostx64\x64\link.exe'
          if (-not (Test-Path -PathType Leaf $linker)) {
            throw "MSVC linker was not found at $linker"
          }
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$linker" >> $env:GITHUB_ENV
      - name: Install the configured macOS linker
        if: matrix.target == 'macos-aarch64'
        run: brew install lld
      - name: Configure temporary macOS notarization path
        if: matrix.target == 'macos-aarch64'
        shell: bash
        run: echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/apple-api-key.p8" >> "$GITHUB_ENV"
      - name: Import Developer ID Application certificate
        if: matrix.target == 'macos-aarch64'
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      - name: Install Developer ID G2 intermediate certificate
        if: matrix.target == 'macos-aarch64'
        shell: bash
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/DeveloperIDG2CA.cer"
          curl --fail --silent --show-error --location \
            https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer \
            --output "$CERTIFICATE_PATH"
          echo "f16cd3c54c7f83cea4bf1a3e6a0819c8aaa8e4a1528fd144715f350643d2df3a  $CERTIFICATE_PATH" |
            shasum -a 256 --check
          sudo security add-trusted-cert \
            -d -r trustRoot \
            -k /Library/Keychains/System.keychain \
            "$CERTIFICATE_PATH"
      - name: Select Developer ID Application identity
        if: matrix.target == 'macos-aarch64'
        shell: bash
        run: |
          IDENTITY="$(
            security find-identity -v -p codesigning |
              awk -F'"' '/Developer ID Application/ { print $2; exit }'
          )"
          test -n "$IDENTITY"
          echo "PROCYON_APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
      - name: Prepare App Store Connect API key
        if: matrix.target == 'macos-aarch64'
        shell: bash
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          test -n "$APPLE_API_KEY"
          test -n "$APPLE_API_KEY_P8"
          test -n "$APPLE_API_ISSUER"
          printf '%s' "$APPLE_API_KEY_P8" > "$APPLE_API_KEY_PATH"
          chmod 600 "$APPLE_API_KEY_PATH"
      - name: Build verified semantic release payloads
        shell: bash
        env:
          PROCYON_REQUIRE_CLEAN_SOURCE: "1"
          PROCYON_REQUIRE_PLATFORM_SIGNING: "1"
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gemma_args=()
          if [[ -n "${GEMMA_ORIGINAL_FILES:-}" ]]; then
            gemma_args=(--gemma-original-files "$GEMMA_ORIGINAL_FILES")
          fi
          pnpm semantic:bundle:production -- \
            --output "target/semantic-production-release/${{ matrix.target }}" \
            --release-base-url \
            "https://github.com/${{ github.repository }}/releases/download/$RELEASE_TAG" \
            --source-revision "${{ github.sha }}" \
            "${gemma_args[@]}"
      - name: Notarize and verify macOS semantic executables
        if: matrix.target == 'macos-aarch64'
        shell: bash
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          ARTIFACTS="target/semantic-production-release/${{ matrix.target }}/artifacts"
          WORKER="$(find "$ARTIFACTS" -maxdepth 1 -type f -name 'procyon.semantic.worker.*' -print -quit)"
          RUNTIME="$(find "$ARTIFACTS" -maxdepth 1 -type f -name 'procyon.semantic.zvec-runtime.*' -print -quit)"
          test -n "$WORKER"
          test -n "$RUNTIME"
          codesign --verify --strict --verbose=2 "$WORKER"
          codesign --verify --strict --verbose=2 "$RUNTIME"
          NOTARY_DIRECTORY="$RUNNER_TEMP/semantic-notary"
          mkdir -p "$NOTARY_DIRECTORY"
          cp "$WORKER" "$RUNTIME" "$NOTARY_DIRECTORY/"
          ditto -c -k --keepParent "$NOTARY_DIRECTORY" "$RUNNER_TEMP/semantic-notary.zip"
          xcrun notarytool submit "$RUNNER_TEMP/semantic-notary.zip" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --wait \
            --timeout 45m \
            --no-s3-acceleration \
            --output-format json > "$RUNNER_TEMP/semantic-notary-result.json"
          node scripts/zvec-runtime-qualification.mjs record-notarization \
            "target/semantic-production-release/${{ matrix.target }}" \
            "$RUNNER_TEMP/semantic-notary-result.json" \
            "$RUNNER_TEMP/semantic-notary.zip"
      - name: Smoke-test protocol, model activation, and component lifecycle
        env:
          PROCYON_REQUIRE_ZVEC_PRODUCTION_TRUST: "1"
        run: >
          node scripts/smoke-semantic-production-bundle.mjs
          "target/semantic-production-release/${{ matrix.target }}"
          --evaluation-report
          "target/semantic-production-release/${{ matrix.target }}/semantic-production-evaluation.json"
      - name: Qualify packaged worker lifecycle and privacy
        env:
          PROCYON_REQUIRE_ZVEC_PRODUCTION_TRUST: "1"
        run: >
          node scripts/qualify-semantic-payload.mjs
          "target/semantic-production-release/${{ matrix.target }}"
      - uses: actions/upload-artifact@v7
        with:
          name: semantic-payloads-${{ matrix.target }}
          path: target/semantic-production-release/${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 14
      - name: Remove temporary signing credentials
        if: always() && matrix.target == 'macos-aarch64'
        shell: bash
        run: rm -f "$APPLE_API_KEY_PATH"

  semantic-catalogs:
    name: Semantic catalog (${{ matrix.target }})
    needs: semantic-payloads
    if: inputs.qualification_run_id == '' && needs.semantic-payloads.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        target:
          - linux-aarch64
          - linux-x86_64
          - macos-aarch64
          - windows-x86_64
    uses: ./.github/workflows/sign-semantic-catalog.yml
    with:
      release-input-artifact: semantic-payloads-${{ matrix.target }}
      signed-catalog-artifact: semantic-catalog-${{ matrix.target }}
    secrets: inherit

  semantic-collect:
    name: Collect qualified semantic component assets
    needs: [semantic-payloads, semantic-catalogs]
    if: ${{ always() && inputs.qualification_run_id == '' && needs.semantic-payloads.result == 'success' && needs.semantic-catalogs.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v8
        with:
          pattern: semantic-payloads-*
          path: semantic-payloads
      - uses: actions/download-artifact@v8
        with:
          pattern: semantic-catalog-*
          path: semantic-catalogs
      - name: Collect unique payloads and target catalogs
        run: >
          node scripts/collect-semantic-release-assets.mjs
          semantic-payloads semantic-catalogs semantic-release-assets
      - name: Aggregate supported-target semantic evaluation
        run: >
          node scripts/aggregate-semantic-production-evaluation.mjs
          semantic-payloads
          semantic-release-assets/semantic-production-evaluation.json
          docs/evaluations/semantic-production-v1.json
      - name: Generate the reviewable component fingerprint lock
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: >
          node scripts/create-semantic-component-release-manifest.mjs
          semantic-release-assets
          semantic-release-assets/semantic-production-evaluation.json
          "${{ github.repository }}"
          "$RELEASE_TAG"
          "${{ github.run_id }}"
          "${{ github.sha }}"
          semantic-release-assets/semantic-component-release.json
      - uses: actions/upload-artifact@v7
        with:
          name: semantic-component-candidate-${{ github.sha }}
          path: semantic-release-assets/
          if-no-files-found: error
          retention-days: 14

  semantic-publish:
    name: Publish approved semantic component release
    if: ${{ inputs.qualification_run_id != '' && inputs.qualify_installed_gemma != true && inputs.measure_installed_gemma != true && vars.SEMANTIC_COMPONENTS_RELEASE_QUALIFIED == 'true' && (inputs.approve_experimental_gemma != true || vars.SEMANTIC_GEMMA_EXPERIMENTAL_APPROVED == 'true') }}
    runs-on: ubuntu-latest
    environment: desktop-release
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v8
        with:
          pattern: semantic-payloads-*
          path: semantic-payloads
          github-token: ${{ github.token }}
          run-id: ${{ inputs.qualification_run_id }}
      - uses: actions/download-artifact@v8
        with:
          pattern: semantic-catalog-*
          path: semantic-catalogs
          github-token: ${{ github.token }}
          run-id: ${{ inputs.qualification_run_id }}
      - name: Download exact Gemma candidate fingerprint lock
        if: inputs.approve_experimental_gemma == true
        uses: actions/download-artifact@v8
        with:
          name: semantic-component-candidate-d3f921fe08e4994a905727a71af102979f4fbe23
          path: candidate-lock
          github-token: ${{ github.token }}
          run-id: ${{ inputs.qualification_run_id }}
      - name: Collect exact retained component assets
        run: >
          node scripts/collect-semantic-release-assets.mjs
          semantic-payloads semantic-catalogs semantic-release-assets
      - name: Reproduce the reviewed semantic evaluation
        run: >
          node scripts/aggregate-semantic-production-evaluation.mjs
          semantic-payloads
          semantic-release-assets/semantic-production-evaluation.json
          docs/evaluations/semantic-production-v1.json
      - name: Match exact evaluated payloads to reviewed evidence
        if: inputs.approve_experimental_gemma != true
        run: >
          node scripts/check-semantic-release-preconditions.mjs
          --policy experimental-alpha
          --report semantic-release-assets/semantic-production-evaluation.json
          --approved-report docs/evaluations/semantic-production-v1.json
      - name: Match exact assets to the approved component lock
        if: inputs.approve_experimental_gemma != true
        env:
          QUALIFICATION_RUN_ID: ${{ inputs.qualification_run_id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: >
          node scripts/verify-semantic-component-release.mjs
          semantic-release-assets
          "$QUALIFICATION_RUN_ID"
          "$RELEASE_TAG"
          docs/evaluations/semantic-component-release-v1.json
      - name: Check explicit experimental Gemma approval and exact signed candidate
        if: inputs.approve_experimental_gemma == true
        env:
          QUALIFICATION_RUN_ID: ${{ inputs.qualification_run_id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          node scripts/check-experimental-gemma-release.mjs \
            semantic-release-assets candidate-lock \
            docs/evaluations/semantic-gemma-experimental-v1.json
          node -e '
            const approval = require("./docs/evaluations/semantic-gemma-experimental-v1.json");
            if (String(approval.qualificationRunId) !== process.env.QUALIFICATION_RUN_ID ||
                approval.releaseTag !== process.env.RELEASE_TAG) {
              throw new Error("experimental Gemma dispatch run/tag differs from reviewed approval");
            }
          '
      - name: Verify four signed Gemma catalogs with the release public key
        if: inputs.approve_experimental_gemma == true
        env:
          VERIFYING_KEY_BASE64: ${{ vars.SEMANTIC_CATALOG_VERIFYING_KEY_BASE64 }}
        run: |
          test -n "$VERIFYING_KEY_BASE64"
          printf '%s' "$VERIFYING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/semantic-catalog.pub"
          for target in linux-aarch64 linux-x86_64 macos-aarch64 windows-x86_64; do
            mkdir "$RUNNER_TEMP/catalog-payloads-$target"
            GEMMA_TARGET="$target" node -e '
              const fs = require("node:fs");
              const path = require("node:path");
              const target = process.env.GEMMA_TARGET;
              const catalog = require(`./semantic-release-assets/semantic-catalog-${target}.json`);
              for (const { id } of catalog.catalog.artifacts) {
                if (!/^[a-zA-Z0-9._-]+$/.test(id)) throw new Error(`invalid artifact id: ${id}`);
                fs.linkSync(path.join("semantic-release-assets", id),
                  path.join(process.env.RUNNER_TEMP, `catalog-payloads-${target}`, id));
              }
            '
            cargo run --quiet --locked -p fm-semantic-components \
              --example semantic_production_catalog -- \
              verify "semantic-release-assets/semantic-catalog-$target.json" \
              "semantic-release-assets/semantic-catalog-$target.sig" \
              "$RUNNER_TEMP/catalog-payloads-$target" "$RUNNER_TEMP/semantic-catalog.pub"
          done
      - name: Publish immutable semantic component release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          APPROVE_EXPERIMENTAL_GEMMA: ${{ inputs.approve_experimental_gemma }}
        run: |
          if [[ "$APPROVE_EXPERIMENTAL_GEMMA" == "true" ]]; then
            SOURCE_REVISION="$(jq -r '.sourceRevision' docs/evaluations/semantic-gemma-experimental-v1.json)"
            RELEASE_NOTES="$(cat docs/evaluations/embeddinggemma-experimental-release-2026-10-10.md)"
          else
            SOURCE_REVISION="$(jq -r '.sourceRevision' docs/evaluations/semantic-component-release-v1.json)"
            RELEASE_NOTES="Qualified optional semantic components for Procyon."
          fi
          test -z "$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG")"
          gh release create "$RELEASE_TAG" \
            --target "$SOURCE_REVISION" \
            --title "$RELEASE_TAG" \
            --latest=false \
            --notes "$RELEASE_NOTES" \
            semantic-release-assets/*

  installed-gemma-qualification:
    name: Installed Gemma (${{ matrix.target }})
    if: inputs.qualify_installed_gemma == true && inputs.qualification_run_id == ''
    runs-on: ${{ matrix.runner }}
    environment: desktop-release
    timeout-minutes: 180
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-aarch64
            runner: ubuntu-24.04-arm
          - target: linux-x86_64
            runner: ubuntu-22.04
          - target: windows-x86_64
            runner: windows-latest
          - target: macos-aarch64
            runner: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v8
        with:
          name: semantic-component-candidate-${{ inputs.installed_candidate_source_revision }}
          path: candidate
          github-token: ${{ github.token }}
          run-id: ${{ inputs.installed_candidate_run_id }}
      - name: Require exact retained candidate identity
        shell: bash
        env:
          CANDIDATE_RUN_ID: ${{ inputs.installed_candidate_run_id }}
          CANDIDATE_SOURCE_REVISION: ${{ inputs.installed_candidate_source_revision }}
        run: |
          node -e '
            const fs = require("node:fs");
            const manifest = JSON.parse(fs.readFileSync("candidate/semantic-component-release.json", "utf8"));
            if (!/^[1-9][0-9]*$/.test(process.env.CANDIDATE_RUN_ID) ||
                !/^[0-9a-f]{40}$/.test(process.env.CANDIDATE_SOURCE_REVISION) ||
                manifest.qualificationRunId !== Number(process.env.CANDIDATE_RUN_ID) ||
                manifest.sourceRevision !== process.env.CANDIDATE_SOURCE_REVISION ||
                manifest.sourceRevision === "d3f921fe08e4994a905727a71af102979f4fbe23") {
              throw new Error("installed Gemma requires a new exact retained candidate");
            }
          '
      - name: Stage exact signed target payloads
        shell: bash
        env:
          GEMMA_TARGET: ${{ matrix.target }}
          VERIFYING_KEY_BASE64: ${{ vars.SEMANTIC_CATALOG_VERIFYING_KEY_BASE64 }}
        run: |
          test -n "$VERIFYING_KEY_BASE64"
          printf '%s' "$VERIFYING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/semantic-catalog.pub"
          node -e '
            const fs = require("node:fs");
            const path = require("node:path");
            const catalog = JSON.parse(fs.readFileSync(path.join("candidate", `semantic-catalog-${process.env.GEMMA_TARGET}.json`), "utf8"));
            fs.mkdirSync("candidate-payloads");
            for (const { id } of catalog.catalog.artifacts) {
              if (!/^[a-zA-Z0-9._-]+$/.test(id)) throw new Error(`invalid artifact id: ${id}`);
              fs.linkSync(path.join("candidate", id), path.join("candidate-payloads", id));
            }
            if (process.env.GEMMA_TARGET === "linux-x86_64") {
              const onnx = catalog.catalog.artifacts.find(({ component_id }) => component_id === "procyon.semantic.onnx-runtime");
              if (!onnx) throw new Error("signed Linux x86 catalog has no ONNX Runtime");
              fs.mkdirSync("candidate-onnx-runtime");
              for (const name of ["libonnxruntime.so", "libonnxruntime.so.1"]) {
                fs.linkSync(path.join("candidate", onnx.id), path.join("candidate-onnx-runtime", name));
              }
              fs.appendFileSync(process.env.GITHUB_ENV, `ORT_LIB_PATH=${path.resolve("candidate-onnx-runtime")}\nORT_PREFER_DYNAMIC_LINK=1\nORT_SKIP_DOWNLOAD=1\n`);
            }
          '
      - name: Verify signed catalog and exact target payloads before linking
        shell: bash
        env:
          GEMMA_TARGET: ${{ matrix.target }}
        run: |
          cargo run --quiet -p fm-semantic-components \
            --example semantic_production_catalog -- \
            verify "candidate/semantic-catalog-$GEMMA_TARGET.json" \
            "candidate/semantic-catalog-$GEMMA_TARGET.sig" \
            candidate-payloads "$RUNNER_TEMP/semantic-catalog.pub"
      - name: Configure the MSVC tool environment
        if: matrix.target == 'windows-x86_64'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Install the configured macOS linker
        if: matrix.target == 'macos-aarch64'
        run: brew install lld
      - name: Select the MSVC linker
        if: matrix.target == 'windows-x86_64'
        shell: pwsh
        run: |
          $linker = Join-Path $env:VCToolsInstallDir 'bin\Hostx64\x64\link.exe'
          if (-not (Test-Path -PathType Leaf $linker)) {
            throw "MSVC linker was not found at $linker"
          }
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$linker" >> $env:GITHUB_ENV
      - name: Build existing offline media smoke
        shell: bash
        run: |
          if ! cargo test -p fm-semantic-worker --features gemma-native \
            --test packaged_production --no-run --message-format=json \
            > "$RUNNER_TEMP/gemma-test-build.json"; then
            node -e '
              const fs = require("node:fs");
              for (const line of fs.readFileSync(process.argv[1], "utf8").trim().split("\n")) {
                const message = JSON.parse(line);
                if (message.reason === "compiler-message" && message.message.level === "error") {
                  console.error(message.message.rendered);
                }
              }
            ' "$RUNNER_TEMP/gemma-test-build.json"
            exit 1
          fi
          node -e '
            const fs = require("node:fs");
            const messages = fs.readFileSync(process.argv[1], "utf8").trim().split("\n").map((line) => JSON.parse(line));
            const tests = messages.filter((message) => message.reason === "compiler-artifact" && message.target.name === "packaged_production" && message.executable);
            if (tests.length !== 1) throw new Error(`expected one packaged_production executable, got ${tests.length}`);
            fs.appendFileSync(process.env.GITHUB_ENV, `PROCYON_GEMMA_INSTALLED_TEST=${tests[0].executable}\n`);
          ' "$RUNNER_TEMP/gemma-test-build.json"
      - name: Qualify exact signed installed Gemma lifecycle offline
        shell: bash
        env:
          GEMMA_TARGET: ${{ matrix.target }}
          MEASURE_INSTALLED_GEMMA: ${{ inputs.measure_installed_gemma }}
        run: |
          if [[ "$MEASURE_INSTALLED_GEMMA" == "true" ]]; then
            export PROCYON_GEMMA_MEASURE_DIR="$RUNNER_TEMP/gemma-cpu"
          fi
          cargo run --quiet -p fm-semantic-components \
            --example qualify_semantic_lifecycle -- \
            "candidate/semantic-catalog-$GEMMA_TARGET.json" \
            "candidate/semantic-catalog-$GEMMA_TARGET.sig" \
            candidate-payloads \
            "$RUNNER_TEMP/semantic-catalog.pub" \
            "$RUNNER_TEMP/gemma-installed-lifecycle" \
            "$RUNNER_TEMP/gemma-installed-report.json"
      - name: Record runner hardware and bounded CPU measurements
        if: inputs.measure_installed_gemma == true
        shell: bash
        env:
          GEMMA_TARGET: ${{ matrix.target }}
          CANDIDATE_RUN_ID: ${{ inputs.installed_candidate_run_id }}
          CANDIDATE_SOURCE_REVISION: ${{ inputs.installed_candidate_source_revision }}
        run: |
          node -e '
            const fs = require("node:fs");
            const os = require("node:os");
            const path = require("node:path");
            const root = path.join(process.env.RUNNER_TEMP, "gemma-cpu");
            const dimensions = [128, 256, 512, 768].map((size) =>
              JSON.parse(fs.readFileSync(path.join(root, `${size}.json`), "utf8")));
            const lifecycle = JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP, "gemma-installed-report.json"), "utf8"));
            if (lifecycle.target !== process.env.GEMMA_TARGET || lifecycle.networkArtifactReads !== 0 ||
                lifecycle.checks.filter(({ status }) => status === "pass").length !== 13) {
              throw new Error("signed installed lifecycle report did not pass before measurement");
            }
            if (dimensions.some((report, index) => report.dimensions !== [128, 256, 512, 768][index] ||
                report.workerPeakRssBytes <= 0 || report.measurements.length !== 4)) {
              throw new Error("missing or invalid per-dimension CPU measurement");
            }
            fs.writeFileSync(path.join(root, "resource-report.json"), JSON.stringify({
              schemaVersion: 1,
              target: process.env.GEMMA_TARGET,
              qualificationRunId: process.env.GITHUB_RUN_ID,
              qualificationSourceRevision: process.env.GITHUB_SHA,
              candidateRunId: process.env.CANDIDATE_RUN_ID,
              candidateSourceRevision: process.env.CANDIDATE_SOURCE_REVISION,
              catalogRevision: lifecycle.catalogRevision,
              catalogSha256: lifecycle.catalogSha256,
              hardware: {
                runnerImage: process.env.ImageOS ?? null,
                runnerName: process.env.RUNNER_NAME,
                cpuModel: os.cpus()[0]?.model,
                logicalCpuCount: os.cpus().length,
                totalMemoryBytes: os.totalmem(),
                platform: os.platform(),
                arch: os.arch(),
                osRelease: os.release(),
              },
              dimensions,
              limitations: "Single synthetic asset per modality and three text queries; fresh process and index per dimension; CPU runner class is virtualized; wall includes IPC and queueing; no quality labels, GPU measurements, sustained throughput, or user workload. macOS peak is sampled, not a kernel high-water mark.",
            }, null, 2));
          '
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: installed-gemma-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/gemma-installed-report.json
            ${{ runner.temp }}/gemma-cpu/*.json
          if-no-files-found: warn
          retention-days: 14
