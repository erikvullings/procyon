name: Release semantic components

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Immutable semantic component tag, for example semantic-v1
        required: true
        type: string
      qualification_run_id:
        description: Exact successful qualification run to publish; leave empty to qualify
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  semantic-payloads:
    name: Semantic payloads (${{ matrix.target }})
    if: inputs.qualification_run_id == ''
    runs-on: ${{ matrix.runner }}
    environment: desktop-release
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-aarch64
            runner: macos-15
          - target: windows-x86_64
            runner: windows-latest
          - target: linux-x86_64
            runner: ubuntu-22.04
          - target: linux-aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Validate immutable component release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^semantic-v[0-9][0-9A-Za-z.-]*$ ]]
          test -z "$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG")"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Configure the MSVC tool environment
        if: matrix.target == 'windows-x86_64'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Select the MSVC linker
        if: matrix.target == 'windows-x86_64'
        shell: pwsh
        run: |
          $linker = Join-Path $env:VCToolsInstallDir 'bin\Hostx64\x64\link.exe'
          if (-not (Test-Path -PathType Leaf $linker)) {
            throw "MSVC linker was not found at $linker"
          }
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$linker" >> $env:GITHUB_ENV
      - name: Install the configured macOS linker
        if: matrix.target == 'macos-aarch64'
        run: brew install lld
      - name: Configure temporary macOS notarization path
        if: matrix.target == 'macos-aarch64'
        shell: bash
        run: echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/apple-api-key.p8" >> "$GITHUB_ENV"
      - name: Import Developer ID Application certificate
        if: matrix.target == 'macos-aarch64'
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      - name: Install Developer ID G2 intermediate certificate
        if: matrix.target == 'macos-aarch64'
        shell: bash
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/DeveloperIDG2CA.cer"
          curl --fail --silent --show-error --location \
            https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer \
            --output "$CERTIFICATE_PATH"
          echo "f16cd3c54c7f83cea4bf1a3e6a0819c8aaa8e4a1528fd144715f350643d2df3a  $CERTIFICATE_PATH" |
            shasum -a 256 --check
          sudo security add-trusted-cert \
            -d -r trustRoot \
            -k /Library/Keychains/System.keychain \
            "$CERTIFICATE_PATH"
      - name: Select Developer ID Application identity
        if: matrix.target == 'macos-aarch64'
        shell: bash
        run: |
          IDENTITY="$(
            security find-identity -v -p codesigning |
              awk -F'"' '/Developer ID Application/ { print $2; exit }'
          )"
          test -n "$IDENTITY"
          echo "PROCYON_APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
      - name: Prepare App Store Connect API key
        if: matrix.target == 'macos-aarch64'
        shell: bash
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          test -n "$APPLE_API_KEY"
          test -n "$APPLE_API_KEY_P8"
          test -n "$APPLE_API_ISSUER"
          printf '%s' "$APPLE_API_KEY_P8" > "$APPLE_API_KEY_PATH"
          chmod 600 "$APPLE_API_KEY_PATH"
      - name: Build verified semantic release payloads
        shell: bash
        env:
          PROCYON_REQUIRE_CLEAN_SOURCE: "1"
          PROCYON_REQUIRE_PLATFORM_SIGNING: "1"
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: >
          pnpm semantic:bundle:production --
          --output "target/semantic-production-release/${{ matrix.target }}"
          --release-base-url
          "https://github.com/${{ github.repository }}/releases/download/$RELEASE_TAG"
          --source-revision "${{ github.sha }}"
      - name: Notarize and verify macOS semantic executables
        if: matrix.target == 'macos-aarch64'
        shell: bash
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          ARTIFACTS="target/semantic-production-release/${{ matrix.target }}/artifacts"
          WORKER="$(find "$ARTIFACTS" -maxdepth 1 -type f -name 'procyon.semantic.worker.*' -print -quit)"
          RUNTIME="$(find "$ARTIFACTS" -maxdepth 1 -type f -name 'procyon.semantic.zvec-runtime.*' -print -quit)"
          test -n "$WORKER"
          test -n "$RUNTIME"
          codesign --verify --strict --verbose=2 "$WORKER"
          codesign --verify --strict --verbose=2 "$RUNTIME"
          NOTARY_DIRECTORY="$RUNNER_TEMP/semantic-notary"
          mkdir -p "$NOTARY_DIRECTORY"
          cp "$WORKER" "$RUNTIME" "$NOTARY_DIRECTORY/"
          ditto -c -k --keepParent "$NOTARY_DIRECTORY" "$RUNNER_TEMP/semantic-notary.zip"
          xcrun notarytool submit "$RUNNER_TEMP/semantic-notary.zip" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --wait \
            --timeout 45m \
            --no-s3-acceleration \
            --output-format json > "$RUNNER_TEMP/semantic-notary-result.json"
          node scripts/zvec-runtime-qualification.mjs record-notarization \
            "target/semantic-production-release/${{ matrix.target }}" \
            "$RUNNER_TEMP/semantic-notary-result.json" \
            "$RUNNER_TEMP/semantic-notary.zip"
      - name: Smoke-test protocol, model activation, and component lifecycle
        env:
          PROCYON_REQUIRE_ZVEC_PRODUCTION_TRUST: "1"
        run: >
          node scripts/smoke-semantic-production-bundle.mjs
          "target/semantic-production-release/${{ matrix.target }}"
          --evaluation-report
          "target/semantic-production-release/${{ matrix.target }}/semantic-production-evaluation.json"
      - name: Qualify packaged worker lifecycle and privacy
        env:
          PROCYON_REQUIRE_ZVEC_PRODUCTION_TRUST: "1"
        run: >
          node scripts/qualify-semantic-payload.mjs
          "target/semantic-production-release/${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: semantic-payloads-${{ matrix.target }}
          path: target/semantic-production-release/${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 14
      - name: Remove temporary signing credentials
        if: always() && matrix.target == 'macos-aarch64'
        shell: bash
        run: rm -f "$APPLE_API_KEY_PATH"

  semantic-catalogs:
    name: Semantic catalog (${{ matrix.target }})
    needs: semantic-payloads
    if: inputs.qualification_run_id == '' && needs.semantic-payloads.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        target:
          - linux-aarch64
          - linux-x86_64
          - macos-aarch64
          - windows-x86_64
    uses: ./.github/workflows/sign-semantic-catalog.yml
    with:
      release-input-artifact: semantic-payloads-${{ matrix.target }}
      signed-catalog-artifact: semantic-catalog-${{ matrix.target }}
    secrets: inherit

  semantic-collect:
    name: Collect qualified semantic component assets
    needs: [semantic-payloads, semantic-catalogs]
    if: ${{ always() && inputs.qualification_run_id == '' && needs.semantic-payloads.result == 'success' && needs.semantic-catalogs.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v5
        with:
          pattern: semantic-payloads-*
          path: semantic-payloads
      - uses: actions/download-artifact@v5
        with:
          pattern: semantic-catalog-*
          path: semantic-catalogs
      - name: Collect unique payloads and target catalogs
        run: >
          node scripts/collect-semantic-release-assets.mjs
          semantic-payloads semantic-catalogs semantic-release-assets
      - name: Aggregate supported-target semantic evaluation
        run: >
          node scripts/aggregate-semantic-production-evaluation.mjs
          semantic-payloads
          semantic-release-assets/semantic-production-evaluation.json
          docs/evaluations/semantic-production-v1.json
      - name: Generate the reviewable component fingerprint lock
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: >
          node scripts/create-semantic-component-release-manifest.mjs
          semantic-release-assets
          semantic-release-assets/semantic-production-evaluation.json
          "${{ github.repository }}"
          "$RELEASE_TAG"
          "${{ github.run_id }}"
          "${{ github.sha }}"
          semantic-release-assets/semantic-component-release.json
      - uses: actions/upload-artifact@v4
        with:
          name: semantic-component-candidate-${{ github.sha }}
          path: semantic-release-assets/
          if-no-files-found: error
          retention-days: 14

  semantic-publish:
    name: Publish approved semantic component release
    if: ${{ inputs.qualification_run_id != '' && vars.SEMANTIC_COMPONENTS_RELEASE_QUALIFIED == 'true' }}
    runs-on: ubuntu-latest
    environment: desktop-release
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v5
        with:
          pattern: semantic-payloads-*
          path: semantic-payloads
          github-token: ${{ github.token }}
          run-id: ${{ inputs.qualification_run_id }}
      - uses: actions/download-artifact@v5
        with:
          pattern: semantic-catalog-*
          path: semantic-catalogs
          github-token: ${{ github.token }}
          run-id: ${{ inputs.qualification_run_id }}
      - name: Collect exact retained component assets
        run: >
          node scripts/collect-semantic-release-assets.mjs
          semantic-payloads semantic-catalogs semantic-release-assets
      - name: Reproduce the reviewed semantic evaluation
        run: >
          node scripts/aggregate-semantic-production-evaluation.mjs
          semantic-payloads
          semantic-release-assets/semantic-production-evaluation.json
          docs/evaluations/semantic-production-v1.json
      - name: Match exact evaluated payloads to reviewed evidence
        run: >
          node scripts/check-semantic-release-preconditions.mjs
          --policy experimental-alpha
          --report semantic-release-assets/semantic-production-evaluation.json
          --approved-report docs/evaluations/semantic-production-v1.json
      - name: Match exact assets to the approved component lock
        env:
          QUALIFICATION_RUN_ID: ${{ inputs.qualification_run_id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: >
          node scripts/verify-semantic-component-release.mjs
          semantic-release-assets
          "$QUALIFICATION_RUN_ID"
          "$RELEASE_TAG"
          docs/evaluations/semantic-component-release-v1.json
      - name: Publish immutable semantic component release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          SOURCE_REVISION="$(
            jq -r '.sourceRevision' docs/evaluations/semantic-component-release-v1.json
          )"
          test -z "$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG")"
          gh release create "$RELEASE_TAG" \
            --target "$SOURCE_REVISION" \
            --title "$RELEASE_TAG" \
            --latest=false \
            --notes "Qualified optional semantic components for Procyon." \
            semantic-release-assets/*
