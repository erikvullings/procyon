name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      frontend: ${{ steps.filter.outputs.frontend }}
      desktop: ${{ steps.filter.outputs.desktop }}
      reuse: ${{ steps.reuse.outputs.reuse }}
    steps:
      - uses: actions/checkout@v7
      # A squash merge whose tree is identical to a fully green PR run reuses that result
      # instead of rebuilding every platform; any mismatch or lookup failure runs full CI.
      - name: Reuse pull-request CI for an identical tree
        id: reuse
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-reuse-gate.mjs
      - name: Record tested tree
        if: github.event_name == 'pull_request'
        run: git rev-parse 'HEAD^{tree}' > tree.txt
      - name: Upload tested tree
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: ci-tested-tree
          path: tree.txt
          retention-days: 14
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            rust:
              - '.cargo/**'
              - '.github/workflows/ci.yml'
              - '**/*.rs'
              - '**/*.proto'
              - '**/Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'rustfmt.toml'
            frontend:
              - '.github/workflows/ci.yml'
              - '**/*.rs'
              - '**/Cargo.toml'
              - 'Cargo.lock'
              - 'biome.json'
              - 'frontend/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'rust-toolchain.toml'
              - 'scripts/export-openapi.mjs'
              - 'scripts/generate-api.mjs'
            desktop:
              - '.cargo/**'
              - '.github/workflows/ci.yml'
              - 'apps/fm-desktop/**'
              - '**/*.rs'
              - '**/Cargo.toml'
              - 'Cargo.lock'
              - 'frontend/**'
              - 'plugins/**'
              - 'plugin-sources/svgo/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'rust-toolchain.toml'
              - 'scripts/build-tauri.mjs'
              - 'scripts/build-svgo-plugin.mjs'
              - 'scripts/smoke-desktop-package.mjs'
              - 'scripts/smoke-native-spa.mjs'

  rust:
    name: Rust (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.reuse != 'true' && (github.event_name == 'push' || needs.changes.outputs.rust == 'true')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Install Tauri system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libgtk-3-dev
      - name: Install lld
        if: matrix.os == 'macos-latest'
        run: brew install lld
      - name: Rust fmt
        run: cargo fmt --all --check
      - name: Clippy (-D warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo nextest run --workspace
      - name: Doctests
        run: cargo test --doc --workspace

  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.reuse != 'true' && (github.event_name == 'push' || needs.changes.outputs.frontend == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format check
        run: pnpm run lint:frontend
      - name: Type check
        run: pnpm --dir frontend run typecheck
      - name: Vitest
        run: pnpm run test:frontend
      - name: Production build
        run: pnpm run build:frontend
      - name: OpenAPI document and generated client are up to date
        run: pnpm run api:check

  desktop:
    name: Tauri build (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.reuse != 'true' && (github.event_name == 'push' || needs.changes.outputs.desktop == 'true')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - name: Install lld
        if: matrix.os == 'macos-latest'
        run: brew install lld
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build unsigned Tauri installers
        run: pnpm run build:tauri
      - name: Install and launch packaged desktop app
        working-directory: apps/fm-desktop/src-tauri
        run: node ../../../scripts/smoke-desktop-package.mjs

  native-spa-smoke:
    name: Native SPA (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.reuse != 'true' && (github.event_name == 'push' || needs.changes.outputs.desktop == 'true')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - name: Install Tauri and virtual-display dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libgtk-3-dev xvfb
      - name: Install lld
        if: matrix.os == 'macos-latest'
        run: brew install lld
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build bundled SVGO from source
        run: node scripts/build-svgo-plugin.mjs
      - name: Build native smoke app
        run: |
          pnpm exec cross-env VITE_RUNTIME=tauri pnpm run build:frontend
          cargo build -p fm-desktop --release --features native-spa-smoke
      - name: Exercise child WebView (macOS and Windows)
        if: matrix.os != 'ubuntu-latest'
        run: node scripts/smoke-native-spa.mjs target/release/fm-desktop${{ runner.os == 'Windows' && '.exe' || '' }}
      - name: Exercise child WebView (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: xvfb-run --auto-servernum node scripts/smoke-native-spa.mjs target/release/fm-desktop
      - name: Build native SPA installer
        run: node scripts/build-tauri.mjs --features native-spa-smoke --config tauri.native-spa-smoke.conf.json --bundles ${{ matrix.os == 'macos-latest' && 'dmg' || matrix.os == 'windows-latest' && 'msi' || 'deb' }}
      - name: Exercise installed native SPA
        run: node scripts/smoke-desktop-package.mjs --native-spa

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    # Advisory-only: never fails the workflow, only surfaces findings in the logs.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: cargo audit
        run: cargo audit
        continue-on-error: true
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: pnpm audit
        run: pnpm audit --audit-level moderate
        continue-on-error: true
