id = "procyon.svgo"
name = "SVGO"
version = "0.1.0"
api_version = "1"
description = "Edit and optimize the SVG file under the cursor in an isolated panel."

[permissions]
selected_entry_content_read = true
selected_entry_content_write = true

[contributions.spa_panel]
entrypoint = "dist/index.html"
action_id = "procyon.svgo.open"
title = "Edit SVG with SVGO"
shortcut = "Cmd+Shift+F4"
extensions = ["svg"]
