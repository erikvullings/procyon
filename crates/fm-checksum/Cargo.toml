[package]
name = "fm-checksum"
description = "Streaming checksum calculation, checksum-file verification and staged duplicate detection."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
blake3.workspace = true
crc32fast.workspace = true
fm-domain.workspace = true
fm-events.workspace = true
fm-vfs = { path = "../fm-vfs" }
md-5.workspace = true
serde.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "rt"] }
tokio-util.workspace = true
uuid.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
criterion.workspace = true
fm-vfs-local.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[[bench]]
name = "hash_throughput"
harness = false

[lints]
workspace = true
