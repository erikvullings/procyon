[package]
name = "fm-semantic-worker"
description = "On-demand local IPC client and isolated semantic worker runtime."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
# The official SDK dynamically links Zvec and downloads a native artifact at
# build time unless ZVEC_LIB_DIR is supplied. Keep it out of normal builds.
zvec = ["dep:zvec-rust"]
# Offline managed semantic runtime used by production and development bundles.
semantic-runtime = [
  "zvec",
  "dep:fm-semantic-components",
  "dep:ort",
  "dep:tokenizers",
]
# Explicitly non-production local bundle used only for end-to-end development.
developer-bundle = ["semantic-runtime"]
# Native CPU dependencies stay out of the E5-only runtime. Optional Gemma
# worker binaries must be built with gemma-native.
gemma-native = ["semantic-runtime", "gemma-probe"]
gemma-probe = ["dep:fm-metadata", "dep:image", "dep:lattice-inference", "dep:symphonia", "dep:tokenizers"]

[dependencies]
caseless.workspace = true
fm-semantic-components = {workspace = true, optional = true}
fm-semantic-conversion.workspace = true
fm-semantic-docling.workspace = true
fm-semantic-protocol.workspace = true
fm-metadata = {workspace = true, optional = true}
fs2.workspace = true
image = {workspace = true, optional = true}
lattice-inference = { git = "https://github.com/ohdearquant/lattice.git", rev = "17915f3748a4047c0af61bd8bc7066d1dccf24b4", default-features = false, features = ["std"], optional = true }
ort = {workspace = true, optional = true, features = ["std", "ndarray", "tracing", "api-27"]}
prost.workspace = true
rand.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
symphonia = { version = "0.5.5", default-features = false, features = ["aac", "flac", "isomp4", "mp3", "pcm", "wav"], optional = true }
thiserror.workspace = true
tokenizers = {workspace = true, optional = true}
tokio.workspace = true
tokio-util.workspace = true
zvec-rust = {workspace = true, optional = true}

[dev-dependencies]
lopdf.workspace = true
tempfile.workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[target.'cfg(not(all(target_os = "linux", target_arch = "x86_64")))'.dependencies]
ort = {workspace = true, optional = true, features = [
  "download-binaries",
  "tls-native",
  "copy-dylibs",
]}

[target.'cfg(windows)'.dependencies]
interprocess.workspace = true
widestring.workspace = true
windows-permissions.workspace = true

[lints]
workspace = true

[[example]]
name = "embeddinggemma_text_probe"
required-features = ["gemma-probe"]

[[example]]
name = "evaluate_gemma_native"
required-features = ["gemma-native"]
