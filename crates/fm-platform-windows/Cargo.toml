[package]
name = "fm-platform-windows"
description = "Windows implementations of the platform adapter traits."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
fm-domain.workspace = true
fm-platform.workspace = true
fm-search-acceleration.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_NetworkManagement_WNet", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
serde_json.workspace = true
tokio-util.workspace = true

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(target_os = "windows")'.dev-dependencies]
windows = { version = "0.61", features = ["Win32_System_Com", "Win32_UI_Shell"] }

[lints]
workspace = true
